<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8f3"><title>间 · 日程</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="appbar"><div class="brand"><span class="mark">间</span><span>间<small>给生活一点留白</small></span></div><button class="avatar" aria-label="个人空间">知</button></header><main id="main" tabindex="-1"><div id="view"></div></main><nav class="dock" aria-label="主导航"><button data-view="home"><span>⌂</span>今天</button><button data-view="calendar"><span>▦</span>日历</button><button class="dock-add" id="add" aria-label="新建事项">＋</button><button data-view="goals"><span>◎</span>目标</button><button data-view="me"><span>◌</span>我的</button></nav><div class="toast" role="status" aria-live="polite"></div></div><dialog id="sheet"><form id="form"><div class="handle"></div><div class="sheet-head"><div><h2 id="form-title">新建事项</h2><p>给重要的事留一个位置</p></div><button type="button" id="close" aria-label="关闭">×</button></div><label>事项名称<input name="title" maxlength="60" required placeholder="想要做什么？"></label><div class="form-row"><label>日期<input name="date" type="date" required></label><label>时间<input name="time" type="time" required></label></div><label>分类<select name="category"><option>工作</option><option>生活</option><option>成长</option></select></label><label>补充说明<textarea name="detail" rows="3" placeholder="写下需要记住的细节（选填）"></textarea></label><button class="save" type="submit">保存事项</button></form></dialog><script src="app.js"></script></body></html>
