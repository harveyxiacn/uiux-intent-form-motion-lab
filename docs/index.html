<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intent / Form / Motion — UIUX Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#eeeae1;color:#222923;font-family:Arial,"Microsoft YaHei",sans-serif}header{max-width:1440px;margin:auto;padding:28px 4vw 22px;display:flex;align-items:end;justify-content:space-between;gap:24px}h1{font-size:clamp(24px,3vw,40px);letter-spacing:-1.5px;margin:0 0 9px}p{margin:0;color:#5c635d;font-size:14px;line-height:1.6}.controls{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.tabs{display:flex;max-width:100%;border:1px solid #a6ada3;border-radius:40px;padding:4px;white-space:nowrap}button{border:0;background:none;color:inherit;border-radius:30px;padding:11px 22px;font-size:14px;cursor:pointer}button[aria-selected=true]{background:#263d31;color:white}a{color:#263d31;font-size:13px;text-underline-offset:4px}button:focus-visible,a:focus-visible{outline:3px solid #bf5b35;outline-offset:3px}main{margin:0 2vw 20px;border:1px solid #bcc2b7;border-radius:12px;overflow:hidden;background:#fff}iframe{display:block;width:100%;height:calc(100vh - 155px);min-height:650px;border:0}footer{max-width:1440px;margin:auto;padding:0 4vw 18px;font-size:12px;color:#666d65}@media(max-width:760px){header{align-items:start;flex-direction:column;padding:24px 5vw 18px;gap:18px}h1{letter-spacing:-.8px}.controls{width:100%;justify-content:space-between;gap:10px}button{padding:10px 12px;font-size:12px}.tabs{width:100%;justify-content:space-between}.controls{justify-content:flex-end}iframe{height:760px;min-height:0}main{margin:0 10px 18px}footer{line-height:1.7}}
</style></head><body><header><div><h1>Intent / Form / Motion</h1><p>先定义目标，再决定样子，最后说清交互。</p></div><div class="controls"><div class="tabs" role="tablist" aria-label="选择演示"><button id="web-tab" role="tab" aria-selected="true" aria-controls="demo-panel" tabindex="0" data-demo="web">官网网页</button><button id="dashboard-tab" role="tab" aria-selected="false" aria-controls="demo-panel" tabindex="-1" data-demo="dashboard">Dashboard Web UI</button><button id="app-tab" role="tab" aria-selected="false" aria-controls="demo-panel" tabindex="-1" data-demo="app">手机 App</button></div><a id="open-demo" href="demos/web/" target="_blank" rel="noopener">独立打开 ↗</a></div></header><main id="demo-panel" role="tabpanel" aria-labelledby="web-tab"><iframe id="demo" title="互动场馆官网演示" src="demos/web/"></iframe></main><footer>UI/UX 学习实验 · 三个可复用 Skill，三类界面实践 · 手机 App 为浏览器交互原型，无后端服务。</footer><script>
const tabs=[...document.querySelectorAll('[role=tab]')],frame=document.querySelector('iframe'),panel=document.querySelector('main'),link=document.querySelector('#open-demo');function select(tab){tabs.forEach(t=>{t.setAttribute('aria-selected',String(t===tab));t.tabIndex=t===tab?0:-1});const name=tab.dataset.demo;frame.src=`demos/${name}/`;frame.title=({web:'互动场馆官网演示',dashboard:'Dashboard Web UI 工作台',app:'手机 App 交互原型'})[name];panel.setAttribute('aria-labelledby',tab.id);link.href=`demos/${name}/`;history.replaceState(null,'',name==='web'?location.pathname:'#'+name)}tabs.forEach((tab,i)=>{tab.addEventListener('click',()=>select(tab));tab.addEventListener('keydown',e=>{let n;if(e.key==='ArrowRight')n=(i+1)%tabs.length;if(e.key==='ArrowLeft')n=(i-1+tabs.length)%tabs.length;if(e.key==='Home')n=0;if(e.key==='End')n=tabs.length-1;if(n!==undefined){e.preventDefault();tabs[n].focus();select(tabs[n])}})});function route(){const target=tabs.find(t=>'#'+t.dataset.demo===location.hash)||tabs[0];select(target)}route();addEventListener('hashchange',route);
</script></body></html>
